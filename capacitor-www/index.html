<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Charity Event Kit</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f4ee;color:#1b2230;font:17px/1.5 system-ui,-apple-system,sans-serif;text-align:center;padding:24px}
  .mark{width:72px;height:72px;border-radius:18px;background:#d9481f;color:#fff;display:grid;place-items:center;font-weight:900;font-size:28px;margin:0 auto 16px}
  button{margin-top:16px;min-height:44px;padding:10px 20px;border-radius:10px;border:0;background:#d9481f;color:#fff;font:inherit;font-weight:700}
</style>
</head>
<body>
  <div>
    <div class="mark" aria-hidden="true">CE</div>
    <h1 style="margin:0 0 8px">You’re offline</h1>
    <p>Charity Event Kit needs an internet connection. Check your Wi-Fi or cell signal, then try again.</p>
    <button onclick="location.href='https://eventkit.ginamakes.app/account'">Try again</button>
  </div>
</body>
</html>
